  category: adjacent_service
  hard_case: HC2
  query_form: null
  ground_truth:
    required:
      - document: "runbooks/checkout-fraud-precheck-rejection"
        section: "Diagnostic Steps"
    acceptable:
      - document: "faqs/payments-checkout-faq"
        section: "A customer says their payment was declined. Where do I even start?"
        reason: "Directly and independently explains that an order can be stopped by fraud screening before Payments is ever involved."
    relevant_insufficient: []
    known_distractors:
      - document: "runbooks/payments-decline-troubleshooting"
        section: null
        reason: "Same customer-facing 'declined' symptom and shared Checkout/Payments vocabulary, but that runbook assumes the request already reached Payments, which the absent Payments record rules out here."
  expected_behavior: answer
  expected_facts:
    - "The absence of a Payments API call confirms this was rejected by Checkout's fraud precheck before ever reaching Payments; the fraud score field indicates which factor drove the rejection."

- id: q029
