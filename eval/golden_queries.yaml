# Sift golden evaluation query set (v1, in progress).
# Schema and authoring rules: .private/evaluation-methodology.md (not public).
# Ground truth is anchored at document + section, never chunk.
# Authored and reviewed in batches; category counts tracked against the locked
# 46-query distribution as batches land.

- id: q001
  query: "What channels does the Notifications service use to send messages to customers?"
  category: straightforward
  hard_case: null
  query_form: null
  ground_truth:
    required:
      - document: "service_docs/notifications"
        section: "Overview"
    acceptable:
      - document: "runbooks/notifications-delivery-failure"
        section: "Purpose"
        reason: "States 'email or SMS' directly in its purpose line; not its main function, but it independently and correctly answers this question if retrieved instead."
    relevant_insufficient: []
    known_distractors: []
  expected_behavior: answer
  expected_facts:
    - "The Notifications service delivers messages via email and SMS."

- id: q002
  query: "We're seeing Payments API gateway timeouts right now, and database connection pool utilization is showing sustained high usage. Have we dealt with something like this before?"
  category: near_duplicate
  hard_case: HC1-pairA
  query_form: null
  ground_truth:
    required:
      - document: "incidents/payments-gateway-timeout-connection-pool"
        section: "Evidence"
      - document: "incidents/payments-gateway-timeout-connection-pool"
        section: "Root Cause"
    acceptable: []
    relevant_insufficient:
      - document: "runbooks/payments-gateway-timeout-troubleshooting"
        section: "Common Causes"
        reason: "Names connection pool exhaustion as a known historical cause category, but doesn't confirm or detail this specific past incident, insufficient alone to answer 'have we seen this before.'"
    known_distractors:
      - document: "incidents/payments-gateway-timeout-cert-expiry"
        section: null
        reason: "Same service, same symptom class (504 timeout, checkout failures), but the actual cause is certificate expiry, not connection pool exhaustion. A retriever matching on surface symptom similarity risks surfacing this instead of, or above, the correct incident."
  expected_behavior: answer
  expected_facts:
    - "This matches a documented incident (connection pool exhaustion) where a deploy reset the pool size from 100 to 20."
    - "Resolved by reverting the connection pool configuration."

