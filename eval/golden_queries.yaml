        section: "Sizing Guidelines"
        reason: "States the general principle that pool sizing should include spike headroom, but doesn't confirm Payments' own documented baseline or that a spike actually coincided with this incident."
    known_distractors: []
  expected_behavior: answer
  expected_facts:
    - "The Payments connection pool is normally configured to 100 specifically to have headroom for traffic spikes such as marketing campaigns."
    - "During the incident, the pool had been unintentionally reduced to 20 by a deploy shortly before the spike began, so it was well outside its intended spike-ready configuration, not a case of a spike simply exceeding a properly sized pool."

